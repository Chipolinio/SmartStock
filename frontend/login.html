<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#070F26',
                        'brand-blue': '#123273',
                        'brand-light-bg': '#F3F6FD',
                        'brand-blue-light': '#E4E9FC',
                        'brand-grey-border': '#F2F2F2',
                        'brand-white': '#FFFFFF',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-brand-light-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Логотип -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-brand-blue">SmartStock</h1>
            <p class="text-gray-500 mt-2">Система аналитики продаж</p>
        </div>

        <!-- Карточка входа/регистрации -->
        <div class="bg-brand-white rounded-xl shadow-lg p-8">
            <!-- Переключатель вкладок -->
            <div class="flex mb-6 border-b border-brand-grey-border">
                <button
                    id="tab-login"
                    class="flex-1 pb-3 text-brand-blue font-semibold border-b-2 border-brand-blue transition-colors"
                    onclick="switchTab('login')"
                >
                    Вход
                </button>
                <button
                    id="tab-register"
                    class="flex-1 pb-3 text-gray-500 hover:text-brand-blue transition-colors"
                    onclick="switchTab('register')"
                >
                    Регистрация
                </button>
            </div>

            <!-- Форма входа -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        required
                        class="w-full px-4 py-2 border border-brand-grey-border rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent outline-none transition"
                        placeholder="example@mail.ru"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input
                        type="password"
                        id="login-password"
                        required
                        class="w-full px-4 py-2 border border-brand-grey-border rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent outline-none transition"
                        placeholder="••••••••"
                    >
                </div>
                <button
                    type="submit"
                    id="login-btn"
                    class="w-full bg-brand-blue text-white py-3 rounded-lg font-semibold hover:bg-brand-blue/90 transition-colors"
                >
                    Войти
                </button>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input
                        type="email"
                        id="register-email"
                        required
                        class="w-full px-4 py-2 border border-brand-grey-border rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent outline-none transition"
                        placeholder="example@mail.ru"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input
                        type="password"
                        id="register-password"
                        required
                        minlength="6"
                        class="w-full px-4 py-2 border border-brand-grey-border rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent outline-none transition"
                        placeholder="••••••••"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Подтверждение пароля</label>
                    <input
                        type="password"
                        id="register-confirm"
                        required
                        minlength="6"
                        class="w-full px-4 py-2 border border-brand-grey-border rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent outline-none transition"
                        placeholder="••••••••"
                    >
                </div>
                <button
                    type="submit"
                    id="register-btn"
                    class="w-full bg-brand-blue text-white py-3 rounded-lg font-semibold hover:bg-brand-blue/90 transition-colors"
                >
                    Зарегистрироваться
                </button>
            </form>

            <!-- Сообщение об ошибке -->
            <div id="error-message" class="mt-4 text-red-500 text-sm text-center hidden"></div>
        </div>

        <!-- Футер -->
        <p class="text-center text-gray-500 text-sm mt-6">
            © 2026 SmartStock. Все права защищены.
        </p>
    </div>

    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        // Переключение вкладок
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const errorDiv = document.getElementById('error-message');

            errorDiv.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('text-brand-blue', 'border-b-2', 'border-brand-blue');
                tabLogin.classList.remove('text-gray-500');
                tabRegister.classList.remove('text-brand-blue', 'border-b-2', 'border-brand-blue');
                tabRegister.classList.add('text-gray-500');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('text-brand-blue', 'border-b-2', 'border-brand-blue');
                tabRegister.classList.remove('text-gray-500');
                tabLogin.classList.remove('text-brand-blue', 'border-b-2', 'border-brand-blue');
                tabLogin.classList.add('text-gray-500');
            }
        }

        // Обработка входа
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');

            try {
                Utils.showLoading(loginBtn);
                errorDiv.classList.add('hidden');

                const loginResponse = await api.login(email, password);

                // Устанавливаем данные пользователя вручную (email известен из формы)
                // Роль по умолчанию 'user' - админка проверится на бэкенде
                AuthHelper.setUserFromToken(email, 'user', false, true);

                Utils.showToast('Успешный вход!', 'success');
                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                Utils.showToast('Ошибка входа: ' + error.message, 'error');
            } finally {
                Utils.hideLoading(loginBtn);
            }
        });

        // Обработка регистрации
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            const errorDiv = document.getElementById('error-message');
            const registerBtn = document.getElementById('register-btn');

            if (password !== confirm) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                Utils.showLoading(registerBtn);
                errorDiv.classList.add('hidden');

                await api.register(email, password);

                // Устанавливаем данные пользователя вручную
                AuthHelper.setUserFromToken(email, 'user', false, true);

                Utils.showToast('Регистрация успешна!', 'success');
                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                Utils.showToast('Ошибка регистрации: ' + error.message, 'error');
            } finally {
                Utils.hideLoading(registerBtn);
            }
        });
    </script>
</body>
</html>
